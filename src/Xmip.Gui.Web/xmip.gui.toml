# The web GUI's configuration. TOML, like everything Xmip configures — the
# node, the estate manifest, the prerequisites. Xmip uses no JSON for
# configuration anywhere, and the ASP.NET defaults that would have added one
# are removed in Program.cs.
#
# Paths are relative to this file's directory: the project directory under
# `dotnet run`, the application's own directory once published.

[Xmip]
# Which surface the page reads (ADR-0052 clause 3): "native", the runtime's
# library loaded in this process, or "snapshot", a file a node or the
# Playground publishes. Chosen here and never guessed from a file in a temp
# directory. The web GUI monitors: it starts no node and offers no Pause or
# Resume (ADR-0014, amendment of 2026-09-05), and its role is Observer.
Surface = "native"

# The runtime's native library, exporting xmip_operate_v1. Found by one rule
# for every surface: this key, else XMIP_RUNTIME_LIBRARY, else the library
# beside the executable.
RuntimeLibrary = "../../../../platform/runtime/target/debug/xmip_core_runtime.dll"

# The file to read when Surface = "snapshot". The Playground writes
# <cluster>-snapshot.toml, named for the cluster a roll was started as, under
# .local-work/playground at the estate root; name the same file here. A path with no file
# behind it is said so on the page, not silently replaced.
# Snapshot = "D:/Repos/Xmip/.local-work/playground/C1-snapshot.toml"

[Kestrel.Endpoints.Http]
Url = "http://localhost:5087"

[Logging.LogLevel]
Default = "Information"
"Microsoft.AspNetCore" = "Warning"
