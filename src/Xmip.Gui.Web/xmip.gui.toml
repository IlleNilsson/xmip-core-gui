# The web GUI's configuration. TOML, like everything Xmip configures — the
# node, the estate manifest, the prerequisites. Xmip uses no JSON for
# configuration anywhere, and the ASP.NET defaults that would have added one
# are removed in Program.cs.
#
# Paths are relative to this file's directory: the project directory under
# `dotnet run`, the application's own directory once published.

[Xmip]
# Which surface the page reads (ADR-0052 clause 3): "local", a node on this
# machine followed over gRPC at the local endpoint Local names — a named pipe
# on Windows, a Unix domain socket elsewhere, the name its [operate] local
# gives (ADR-0014, amendment 2026-10-13) — "snapshot", a file a node or the
# Playground publishes, or "remote", a node on another machine followed over
# gRPC at its operate Address. Chosen here and never guessed from a file in a
# temp directory. Local left out, the page says no node is named.
Surface = "local"
# Local = "xmip-node1"

# The role every proven caller holds (ADR-0009): observer watches, operator
# also pauses, resumes and removes, developer also opens configuration. Else
# XMIP_ROLE; stated by neither, the role is what the directory named by
# Directory grants the caller, and with no directory it is observer, so an
# unstated role grants nothing (ADR-0009, amendment 2026-10-06). A word that
# is no role is observer. A caller is proven by the client certificate its
# browser presented, else by this machine's loopback as the user this host
# runs as; one nothing proved watches and acts on nothing. Every act from a
# browser is decided and audited as its caller.
# Role = "observer"

# The directory asked where no role is stated. The one kind built is
# "tester", the Playground's fake directory: it allows the user this host
# runs as every role, and no one else (ADR-0009, amendment 2026-09-14).
# Start-XmipOperationWeb names it for a host that follows a Playground roll.
# Directory = "tester"

# The runtime's native library, exporting xmip_operate_v1: what every surface
# calls the runtime through, the gRPC client a local or remote surface follows
# its node with among it. Found by one rule: this key, else
# XMIP_RUNTIME_LIBRARY, else the library beside the executable.
RuntimeLibrary = "module/platform/runtime/target/debug/xmip_core_runtime.dll"

# The file to read when Surface = "snapshot". The Playground writes
# <cluster>-snapshot.toml, named for the cluster a roll was started as, under
# .local-work/playground at the estate root; name the same file here. A path
# with no file behind it is said so on the page, not silently replaced.
# Snapshot = "D:/Repos/Xmip/.local-work/playground/C1-snapshot.toml"
#
# A list is one cluster per file, and the three views say which cluster they
# are on and move between them (ADR-0052, amendment 2026-09-20). Two files
# publishing one cluster are REFUSED, because a cluster rolls once.
# Snapshot = [
#   "D:/Repos/Xmip/.local-work/playground/C1-snapshot.toml",
#   "D:/Repos/Xmip/.local-work/playground/C2-snapshot.toml",
# ]

# The node to follow when Surface = "remote", at its operate address,
# host:port (ADR-0067). A node that does not answer is said so on the page.
# gRPC inside Xmip's mutual TLS: presenting Certificate below and taking the
# node only where its certificate reaches TrustAnchor (ADR-0063).
# Address = "node1:7401"

# Xmip's own traffic is TLS (ADR-0063 clause 1). This host binds plain http on
# loopback only, and says so in its log and its audit; any other address is
# https:// and presents this certificate — a PEM chain, leaf first, and its
# PEM private key — and checks the certificate a remote surface presents
# against TrustAnchor, a PEM file of anchors (unset: the operating system's
# trust store). The same keys are what this host presents and trusts when it
# follows another. Each else XMIP_CERTIFICATE, XMIP_PRIVATE_KEY and
# XMIP_TRUST_ANCHOR. Where the files come from is provisioning's (ADR-0034).
# Certificate = "D:/Repos/Xmip/.local-work/tls/node.pem"
# PrivateKey = "D:/Repos/Xmip/.local-work/tls/node.key"
# TrustAnchor = "D:/Repos/Xmip/.local-work/tls/anchor.pem"

# Where this host's audit records go (ADR-0062): its start and stop, every
# error it logs — a circuit that dies among them — and every viewer's
# circuit, as <AuditDirectory>/audit.toml. Unset, the audit capability
# decides: XMIP_AUDIT_DIRECTORY, which Start-XmipOperationWeb's session sets
# to .local-work/audit, else the operating system's log.
# AuditDirectory = "D:/Repos/Xmip/.local-work/audit"

# Where this host listens. Plain http is refused anywhere but loopback; for
# another machine, https://0.0.0.0:5443 with Certificate and PrivateKey above.
[Kestrel.Endpoints.Http]
Url = "http://localhost:5087"

[Logging.LogLevel]
Default = "Information"
"Microsoft.AspNetCore" = "Warning"
