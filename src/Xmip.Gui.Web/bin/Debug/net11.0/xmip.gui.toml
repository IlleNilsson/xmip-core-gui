# The web GUI's configuration. TOML, like everything Xmip configures — the
# node, the estate manifest, the prerequisites. Xmip uses no JSON for
# configuration anywhere, and the ASP.NET defaults that would have added one
# are removed in Program.cs.
#
# Paths are relative to this file's directory.

[Xmip]
# The runtime's native library, exporting xmip_operate_v1 and xmip_start_v1.
RuntimeLibrary = "../../../../platform/runtime/target/debug/xmip_core_runtime.dll"

# The node to start when the GUI starts. Remove the line to start nothing; the
# runtime then says so on the page.
NodeConfiguration = "../../samples/edge-01.xmip.toml"

[Kestrel.Endpoints.Http]
Url = "http://localhost:5087"

[Logging.LogLevel]
Default = "Information"
"Microsoft.AspNetCore" = "Warning"
