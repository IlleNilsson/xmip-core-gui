# The desktop GUI's configuration. TOML, like everything Xmip configures —
# Xmip uses no JSON for configuration anywhere.
#
# Paths are resolved against the repository root during development (see
# MauiProgram.cs); a packaged app resolves them against its own directory.

[Xmip]
# Which surface the board reads (ADR-0052 clause 3): "native", the runtime's
# library loaded in this process, "snapshot", a file a node or the Playground
# publishes, or "remote", a web host followed over its surface hub at Url.
# Chosen here and never guessed from a file in a temp directory. The same
# keys as the web host's xmip.gui.toml.
Surface = "native"

# The runtime's native library, exporting xmip_operate_v1, xmip_start_v1 and
# xmip_validate_v1. Found by one rule for every surface: this key, else
# XMIP_RUNTIME_LIBRARY, else the library beside the executable.
RuntimeLibrary = "module/platform/runtime/target/debug/xmip_core_runtime.dll"

# The node to start and watch when the surface is native — the desktop
# configures, and starting a node is the one thing a browser cannot do
# (ADR-0014, amendment of 2026-09-05). Remove the line to start nothing.
NodeConfiguration = "module/operation/gui/samples/edge-01.xmip.toml"

# The file to read when Surface = "snapshot". The Playground writes
# <cluster>-snapshot.toml, named for whatever the roll's cluster was called;
# name the file yours writes. A path with no file behind it is said so on the
# page, not silently replaced.
# Snapshot = "D:/Repos/Xmip/.local-work/playground/C1-snapshot.toml"

# The web host to follow when Surface = "remote".
# Url = "http://another-host:5087"

# The role this desktop runs as (ADR-0009): observer, operator or developer.
# Assigned here or in XMIP_ROLE, never chosen in the UI; absent, Observer.
# Role = "operator"
