# The desktop GUI's configuration. TOML, like everything Xmip configures —
# Xmip uses no JSON for configuration anywhere.
#
# Paths are resolved against the repository root during development (see
# MauiProgram.cs); a packaged app resolves them against its own directory.

[Xmip]
# Which surface the board reads (ADR-0052 clause 3): "native", the runtime's
# library loaded in this process, "snapshot", a file a node or the Playground
# publishes, or "remote", a web host followed over its surface hub at Url.
# Chosen here and never guessed from a file in a temp directory. The same
# keys as the web host's xmip.gui.toml.
Surface = "native"

# The runtime's native library, exporting xmip_operate_v1, xmip_start_v1,
# xmip_validate_v1 and the cluster's views, edit and slices (xmip_operate.h
# section 10). Found by one rule for every surface: this key, else
# XMIP_RUNTIME_LIBRARY, else the library beside the executable.
RuntimeLibrary = "module/platform/runtime/target/debug/xmip_core_runtime.dll"

# The cluster's xmip.toml the Configure page edits: the one configuration
# anyone edits, a node's own file never (ADR-0031, amendment 2026-10-05).
# Saving it slices it for every node it declares. Unset, xmip/xmip.toml under
# the app's data, written on the first save.
ClusterConfiguration = "module/core/operation/gui/samples/xmip.toml"

# The node of that cluster configured here: its key under [nodes]. Its slice
# is written where that node reads it, so saving ships it; when the surface
# is native it is planned only by the page's Plan button, never at launch — read,
# validated and its plan published through xmip_start_v1, the one thing a
# browser cannot do (ADR-0014, amendment of 2026-09-05). Nothing runs it
# here: a node runs in the program that links its technologies. Remove the
# line to plan nothing.
Node = "edge-01"

# Where each node's slice is written on save, as <node>/xmip-node.toml, the
# name desired state writes it by. The slice of the Node above is shipped by
# being written here; another node's is written and said not shipped, since
# Xmip has no path yet that puts a file on another node. Unset, xmip/slices
# under the app's data.
# SliceDirectory = ".local-work/slices"

# The file to read when Surface = "snapshot". The Playground writes
# <cluster>-snapshot.toml, named for whatever the roll's cluster was called;
# name the file yours writes. A path with no file behind it is said so on the
# page, not silently replaced.
# Snapshot = "D:/Repos/Xmip/.local-work/playground/C1-snapshot.toml"

# The web host to follow when Surface = "remote".
# HTTPS, presenting Certificate and checking the host's certificate against
# TrustAnchor (PEM files; unset, nothing presented and the operating system's
# trust store), each else XMIP_CERTIFICATE, XMIP_PRIVATE_KEY and
# XMIP_TRUST_ANCHOR. Plain http only to this machine (ADR-0063 clause 1).
# Url = "https://another-host:5443"
# Certificate = "surface.pem"
# PrivateKey = "surface.key"
# TrustAnchor = "anchor.pem"

# Where this desktop's audit records go (ADR-0062): its start and stop, every
# save, slice and ship, every refused edit, every validate and plan of a
# node, and every error it logs, as
# <AuditDirectory>/audit.toml. Unset, the audit capability decides:
# XMIP_AUDIT_DIRECTORY, else the operating system's log.
# AuditDirectory = ".local-work/audit"

# The role this desktop runs as (ADR-0009): observer, operator or developer.
# Assigned here or in XMIP_ROLE, never chosen in the UI; stated by neither,
# the role is the directory's, and with none configured the tester holds
# every role (ADR-0014 and ADR-0052, amendments 2026-09-14). A word that is
# no role is observer. The web host takes it by the same rule.
# Role = "operator"
